# OpenShell gateway deployment for Kind (Podman DooD via host socket mount)
apiVersion: v1
kind: Namespace
metadata:
  name: openshell
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openshell-gateway-config
  namespace: openshell
data:
  gateway.toml: |
    [openshell]
    version = 1

    [openshell.gateway]
    bind_address        = "0.0.0.0:9080"
    health_bind_address = "0.0.0.0:8081"
    log_level           = "info"
    compute_drivers     = ["podman"]
    disable_tls         = true

    [openshell.gateway.gateway_jwt]
    signing_key_path = "/certs/jwt/signing.pem"
    public_key_path  = "/certs/jwt/public.pem"
    kid_path         = "/certs/jwt/kid"

    [openshell.gateway.auth]
    allow_unauthenticated_users = true

    [openshell.drivers.kubernetes]
    namespace = "openshell"

    [openshell.drivers.podman]
    socket_path       = "/run/user/501/podman/podman.sock"
    default_image     = "ghcr.io/nvidia/openshell-community/sandboxes/base:latest"
    supervisor_image  = "ghcr.io/nvidia/openshell/supervisor:latest"
    image_pull_policy = "missing"
    grpc_endpoint     = "http://host.containers.internal:9080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshell-gateway
  namespace: openshell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openshell-gateway
  template:
    metadata:
      labels:
        app: openshell-gateway
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 0
      containers:
        - name: gateway
          image: ghcr.io/nvidia/openshell/gateway:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--bind-address"
            - "0.0.0.0"
            - "--port"
            - "9080"
            - "--drivers"
            - "podman"
            - "--disable-tls"
            - "--config"
            - "/etc/openshell/gateway.toml"
          ports:
            - containerPort: 9080
              name: grpc
            - containerPort: 8081
              name: health
          volumeMounts:
            - name: config
              mountPath: /etc/openshell/gateway.toml
              subPath: gateway.toml
              readOnly: true
            - name: podman-socket
              mountPath: /run/user/501/podman/podman.sock
            - name: openshell-data
              mountPath: /var/lib/openshell
            - name: openshell-certs
              mountPath: /certs
              readOnly: true
          env:
            - name: OPENSHELL_GATEWAY_CONFIG
              value: /etc/openshell/gateway.toml
            - name: OPENSHELL_DB_URL
              value: "sqlite:/var/lib/openshell/gateway.db?mode=rwc"
            - name: XDG_DATA_HOME
              value: /var/lib/openshell
            - name: HOME
              value: /var/lib/openshell
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: openshell-gateway-config
        - name: podman-socket
          hostPath:
            path: /run/user/501/podman/podman.sock
            type: Socket
        - name: openshell-data
          hostPath:
            path: /var/lib/openshell-data
            type: DirectoryOrCreate
        - name: openshell-certs
          hostPath:
            path: /var/lib/openshell-certs
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: openshell-gateway
  namespace: openshell
spec:
  type: NodePort
  selector:
    app: openshell-gateway
  ports:
    - name: grpc
      port: 9080
      targetPort: 9080
      nodePort: 30080
    - name: health
      port: 8081
      targetPort: 8081
      nodePort: 30081
