# OpenShift production overrides for the OpenShell Helm chart.
#
# TLS stays enabled (the gateway terminates its own TLS/mTLS) and
# cert-manager issues an externally-trusted server certificate for the
# Route hostname. CLI auth is OIDC — no unauthenticated bypass, unlike
# values-eval.yaml.
#
# Cluster-specific values (ClusterIssuer name, external hostname, OIDC
# issuer/audience) are intentionally NOT set here — `make ocp-prod-openshell-up`
# passes them as --set flags from OCP_PROD_* variables, since they differ
# per cluster/environment and don't belong in a committed values file.
#
# Prerequisites this repo does not manage:
#   - cert-manager installed, with a working Issuer/ClusterIssuer
#   - An OIDC provider issuing tokens for the OpenShell CLI audience
# See docs/kubernetes/openshift.mdx and docs/kubernetes/managing-certificates.mdx
# in the OpenShell repo for background on both.

certManager:
  enabled: true

# OpenShift's SCC admission assigns UID/fsGroup itself; the chart's
# hardcoded defaults conflict with that, so clear them.
podSecurityContext:
  fsGroup: null

securityContext:
  runAsUser: null
